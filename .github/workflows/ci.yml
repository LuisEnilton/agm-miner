name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: research_user
          POSTGRES_PASSWORD: research_password
          POSTGRES_DB: agm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research_user -d agm_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg2://research_user:research_password@localhost:5432/agm_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pipx install poetry
      - name: Install dependencies
        run: poetry install --all-extras
      - name: Lint
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
      - name: Test
        run: poetry run pytest
