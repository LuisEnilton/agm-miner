services:
  db:
    image: postgres:15-alpine
    container_name: msr_research_db
    environment:
      POSTGRES_USER: research_user
      POSTGRES_PASSWORD: research_password
      POSTGRES_DB: agent_artifacts_research
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U research_user -d agent_artifacts_research"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata: