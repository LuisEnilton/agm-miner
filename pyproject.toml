[project]
name = "agm-miner"
version = "1.0.0"
description = "Mining pipeline for AI agent configuration artifacts (CLAUDE.md, AGENTS.md, Claude skills) on GitHub"
authors = [{ name = "Luis Enilton Luz Oliveira" }, { name = "Guilherme Avelino" }]
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<4.0"
dependencies = [
	"alembic (>=1.13.1,<2.0.0)",
	"pygithub (>=2.2.0,<3.0.0)",
	"sqlalchemy (>=2.0.28,<3.0.0)",
	"psycopg2-binary (>=2.9.9,<3.0.0)",
	"polars (>=1.0,<2.0)",
	"pyarrow (>=15.0)",
	"pydantic-settings (>=2.2.1,<3.0.0)",
	"typer (>=0.12)",
	"pyyaml (>=6.0)",
	"markdown-it-py (>=3.0)",
	"textstat (>=0.7.4)",
	"pyphen (>=0.14)",
	"langdetect (>=1.0.9)",
	"scipy (>=1.11)",
	"rich (>=13.8)",
	"anthropic (>=2.1.0,<3.0.0)",
	"linkify-it-py (>=2.0)",
]

[project.optional-dependencies]
# Gemini was only used to test the pipeline on the free tier; the final collection used Anthropic.
gemini = ["google-genai (>=2.33.0,<3.0.0)"]

[project.scripts]
agm = "agm_miner.cli:app"

[tool.poetry]
packages = [{ include = "agm_miner", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
ruff = ">=0.6"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "db: requires a reachable PostgreSQL (TEST_DATABASE_URL)",
    "git: requires the git executable",
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
