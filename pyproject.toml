[project]
name = "agm-miner"
version = "0.1.0"
description = "GitHub repository mining pipeline for agent artifacts"
authors = [{ name = "GitHub Copilot" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
	"fastapi (>=0.110.0,<0.111.0)",
	"uvicorn (>=0.28.0,<0.29.0)",
	"alembic (>=1.13.1,<2.0.0)",
	"pygithub (>=2.2.0,<3.0.0)",
	"sqlalchemy (>=2.0.28,<3.0.0)",
	"psycopg2-binary (>=2.9.9,<3.0.0)",
	"polars (>=0.20.15,<0.21.0)",
	"pyarrow (>=15.0.0,<16.0.0)",
	"pydantic-settings (>=2.2.1,<3.0.0)",
]

[project.scripts]
agm-miner = "agm_miner.main:run"

[tool.poetry]
packages = [{ include = "agm_miner", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-asyncio = "^0.23.6"
ruff = "^0.4.8"
ipykernel = "^7.3.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"