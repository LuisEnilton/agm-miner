[project]
name = "agm-miner"
version = "0.1.0"
description = "Mining pipeline for AI agent configuration artifacts (CLAUDE.md, AGENTS.md, Claude skills) on GitHub"
authors = [{ name = "Luis Enilton" }]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
	"alembic (>=1.13.1,<2.0.0)",
	"pygithub (>=2.2.0,<3.0.0)",
	"sqlalchemy (>=2.0.28,<3.0.0)",
	"psycopg2-binary (>=2.9.9,<3.0.0)",
	"polars (>=1.0,<2.0)",
	"pyarrow (>=15.0)",
	"pydantic-settings (>=2.2.1,<3.0.0)",
	"typer (>=0.12)",
	"pyyaml (>=6.0)",
	"markdown-it-py (>=3.0)",
	"textstat (>=0.7.4)",
	"langdetect (>=1.0.9)",
	"scipy (>=1.11)",
]

[project.scripts]
agm = "agm_miner.cli:app"

[tool.poetry]
packages = [{ include = "agm_miner", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
ruff = ">=0.6"
ipykernel = "^7.3.0"

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "db: requires a reachable PostgreSQL (TEST_DATABASE_URL)",
    "git: requires the git executable",
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
