# Methodological parameters of the study. Every pipeline run stores a snapshot of this file
# (pipeline_runs.study_config), so change values here instead of editing code.
# Omitted keys fall back to the defaults in src/agm_miner/config.py.
version: 1

discovery:
  queries:
    - "filename:CLAUDE.md"
    - "filename:AGENTS.md"
    - "path:.claude/skills filename:SKILL.md"
  # Files smaller than analysis.min_artifact_bytes never enter the sample, so they are not
  # searched for (this also avoids the densest size slices, where the 1000-result cap bites).
  size_min: 2048

selection:
  min_stars: 50
  min_commits: 10
  exclude_forks: true
  exclude_archived: true
  exclude_templates: true
  exclude_mirrors: true
  # Only repositories created before this date. Related studies use 2024-01-01 (projects older
  # than the agent tools); this study keeps projects created with agents and only leaves out
  # the newest ones, whose history is too short before the reference date.
  created_before: 2026-08-01
  # allowed_licenses: OSI-approved licenses (default list in config.py), as in the same studies.
  require_code_language: true   # primary language must not be Markdown, HTML or other prose
  # Latest commit of the default branch within a year of the reference date.
  active_within_days: 365
  reference_date: 2026-09-23    # start of the data collection; keep it fixed afterwards

mining:
  max_content_bytes: 2097152
  rename_candidate_limit: 200

analysis:
  burst_window_hours: 24
  # Study sample, applied to the mined data: instruction files / skill manifests of at least
  # 2 KiB in repositories with at least 2 human authors.
  min_artifact_bytes: 2048
  min_human_contributors: 2
  # Repositories are mined over weeks; the analysis drops every commit after the end of
  # selection.reference_date, so all of them are seen at that same instant.
  truncate_at_reference_date: true

rq1:
  # Label-creation sample (agm rq1 sample): stratified by tool x artifact kind x length
  # (< 50, 50-149, >= 150 words), at most 5 sections per repository.
  sample_size: 400
  per_repo_cap: 5
  length_bins: [50, 150]
  seed: 20261022
  # FINAL COLLECTION (2026-11): the sample was classified with provider anthropic, the
  # Claude Sonnet 5.5 model at effort low, prompt classify-v1 and the codebook of the Agent READMEs
  # paper (codebooks/seed_agent_readmes.yaml), through the Message Batches API (see classify.json
  # in DATA_DIR/rq1/<gold>/classify/ for the run that was actually executed). The values below
  # reproduce that run with `agm rq1 classify --kind INSTRUCTION --kind SKILL_MANIFEST`.
  #
  # TESTING PHASE (before the final collection): the pipeline ran on the free tier of the Gemini
  # API (gemini-3.5-flash-lite); limits per minute and per day are in
  # https://aistudio.google.com/rate-limit, and answers are cached, so a run stopped by the daily
  # limit continues later. To test again with Gemini, pass `--model gemini:gemini-3.5-flash-lite`
  # to the commands. Cache keys and output folders include the provider and model, so test
  # answers never mix with final ones.
  provider: anthropic
  gemini_requests_per_minute: 12   # free tier of gemini-3.5-flash-lite: 15/min, 500/day
  propose_model: claude-opus-5-5
  propose_effort: high
  consolidate_model: claude-opus-5-5
  consolidate_effort: high
  classify_model: claude-sonnet-5-5
  classify_effort: low
  codebook: codebooks/seed_agent_readmes.yaml   # codebook used by classify, saturation and validate
  saturation_size: 100
  chunk_sections: 30
  validation_size: 300
